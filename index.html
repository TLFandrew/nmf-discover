    /* Accessibility: visible keyboard focus for anyone navigating without a mouse. */
    :focus-visible { outline: 3px solid #ffb38a; outline-offset: 2px; border-radius: 4px; }

    /* Accessibility: visually hidden but readable by screen readers. */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

// Mahjong mapping: each category is a suit; each booth gets a rank that cycles
// down the aisle (1-9 for the three simple suits, fewer for the honour suits).
const CATEGORY_SUIT = {
  Food: "circle",
  Artist: "bamboo",
  Vendor: "char",
  Performance: "wind",
  Activity: "dragon",
  Contest: "flower",
  Film: "season"
};
const SUIT_SIZE = {
  circle: 9,
  bamboo: 9,
  char: 9,
  wind: 4,
  dragon: 3,
  flower: 4,
  season: 4
};
const SUIT_TOTAL = {
  circle: 36,
  bamboo: 36,
  char: 36,
  wind: 16,
  dragon: 12,
  flower: 4,
  season: 4
}; // full 144-tile set
const TILE_BY_ID = (() => {
  const counters = {},
    map = {};
  VENDORS.forEach(v => {
    const suit = CATEGORY_SUIT[v.category];
    if (!suit) return;
    const n = counters[suit] || 0;
    map[v.id] = {
      suit,
      rank: n % SUIT_SIZE[suit] + 1,
      name: v.name,
      category: v.category
    };
    counters[suit] = n + 1;
  });
  return map;
})();

function qrDataURL(text) {
  try {
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    return qr.createDataURL(6, 8);
  } catch (e) {
    return null;
  }
}
// Pull a booth id out of a scanned QR, whether it's a full URL, a ?claim=, or a bare number.
function parseClaim(data) {
  try {
    const c = new URL(data).searchParams.get("claim");
    if (c && TILE_BY_ID[Number(c)]) return Number(c);
  } catch (e) {}
  const m = String(data).match(/claim=(\d+)/);
  if (m && TILE_BY_ID[Number(m[1])]) return Number(m[1]);
  const n = Number(data);
  if (!isNaN(n) && TILE_BY_ID[n]) return n;
  return null;
}

  const text = q.toLowerCase();
  const expansions = {
    thirsty: ["drinks", "boba", "bubble tea", "matcha", "tea", "chai", "taro"],
    drink: ["drinks", "boba", "bubble tea", "matcha", "tea", "chai"],
    hungry: ["street food", "rice bowls", "noodles", "comfort food", "bbq"],
    hot: ["shaved ice", "dessert", "boba", "drinks", "matcha"],

    relax: ["lounge", "chill", "relaxation", "ambient"],

    sad: ["comfort food", "sweet", "dessert", "lounge", "chill"],
    bored: ["game", "interactive", "challenge", "craft", "dance"],
    lonely: ["lounge", "social", "chill", "collaborative"],
    happy: ["dance", "k-pop", "dj", "high energy"],
    excited: ["dance", "k-pop", "dj", "high energy"],
    dance: ["dance", "k-pop", "dj", "high energy"],
    kids: ["kids", "family", "all ages", "game", "interactive"],
    family: ["family", "kids", "all ages", "interactive"],
    gift: ["prints", "stickers", "handmade", "jewelry", "accessories", "apparel"],
    vegan: ["vegan options", "vegetarian"],
    vegetarian: ["vegetarian", "vegan options"]
  };
  const STOPWORDS = new Set(["im", "the", "and", "for", "are", "you", "want", "like", "some", "something", "looking", "feel", "feeling", "really", "just", "need", "got", "any", "what", "whats", "where", "have", "this", "that", "give", "show", "find", "with"]);
  const words = text.split(/[^a-z]+/).filter(w => w.length >= 3 && !STOPWORDS.has(w));
  const terms = new Set(words);
  let matchedState = null;
  words.forEach(w => {
    const stem = w.replace(/(ing|ed|s)$/, "");
    Object.keys(expansions).forEach(key => {
      if (w.includes(key) || key.includes(stem)) {
        expansions[key].forEach(t => terms.add(t));
        if (STATE_MESSAGES[key] && !matchedState) matchedState = key;
      }
    });
  });
  const scored = VENDORS.map(v => {
    const tagStr = (v.tags.join(" ") + " " + v.subcategory).toLowerCase();
    const descStr = `${v.name} ${v.description} ${v.products || ""}`.toLowerCase();
    const tagWords = new Set(tagStr.split(/[^a-z]+/).filter(Boolean));
    const descWords = new Set(descStr.split(/[^a-z]+/).filter(Boolean));
    let score = 0;
    terms.forEach(t => {
      if (t.includes(" ")) {
        if (tagStr.includes(t)) score += 2;else if (descStr.includes(t)) score += 1;
      } else {
        if (tagWords.has(t)) score += 2;else if (descWords.has(t)) score += 1;
      }
    });
    return {
      v,
      score
    };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 6).map(x => x.v);
  return {
    vendors: scored,
    stateKey: matchedState
  };
}
